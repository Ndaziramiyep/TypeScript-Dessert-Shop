<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript Dessert Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Desserts</h1>
            <p class="text-gray-600">Sweet treats made with love</p>
        </header>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Desserts Grid Section -->
            <main class="lg:w-2/3">
                <h2 class="text-2xl font-semibold text-gray-700 mb-6">Our Desserts</h2>
                <div id="desserts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Dessert cards will be dynamically inserted here -->
                </div>
            </main>

            <!-- Cart Section -->
            <aside class="lg:w-1/3">
                <div class="bg-white rounded-xl shadow-lg p-6 sticky top-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-semibold text-gray-700" id="cart-title">Your Cart (<span id="cart-count">0</span>)</h2>
                        <button id="clear-cart-btn" class="text-red-500 hover:text-red-700 text-sm font-medium hidden">
                            <i class="fas fa-trash mr-1"></i> Clear All
                        </button>
                    </div>
                    
                    <div id="cart-empty-state" class="text-center py-8">
                        <i class="fas fa-shopping-cart text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500">Your added items will appear here</p>
                    </div>
                    
                    <div id="cart-items-container" class="hidden">
                        <div id="cart-items-list" class="space-y-4 mb-6">
                            <!-- Cart items will be dynamically inserted here -->
                        </div>
                        
                        <div class="border-t pt-4">
                            <div class="flex justify-between mb-2">
                                <span class="text-gray-600">Subtotal</span>
                                <span id="cart-subtotal" class="font-medium">$0.00</span>
                            </div>
                            <div class="flex justify-between mb-4">
                                <span class="text-gray-600">Tax (10%)</span>
                                <span id="cart-tax" class="font-medium">$0.00</span>
                            </div>
                            <div class="flex justify-between text-lg font-bold mb-2">
                                <span>Order Total</span>
                                <span id="cart-total">$0.00</span>
                            </div>
                            <p class="text-sm text-green-600 mb-6 flex items-center">
                                <i class="fas fa-leaf mr-2"></i>
                                This is a carbon-neutral delivery
                            </p>
                            
                            <div id="cart-buttons" class="space-y-3">
                                <button id="confirm-order-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                                    Confirm Order
                                </button>
                                <button id="start-new-order-btn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-3 px-4 rounded-lg transition duration-200 hidden">
                                    Start New Order
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Order Confirmation Modal -->
        <div id="order-confirmation-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
                <div class="p-6">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-check text-green-600 text-2xl"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-800 mb-2">Order Confirmed</h3>
                        <p class="text-gray-600">We hope you enjoy your food!</p>
                    </div>
                    
                    <div id="order-summary" class="mb-6">
                        <!-- Order items will be inserted here -->
                    </div>
                    
                    <div class="border-t pt-4">
                        <div class="flex justify-between text-lg font-bold mb-2">
                            <span>Order Total</span>
                            <span id="order-confirm-total">$0.00</span>
                        </div>
                        <p class="text-sm text-green-600 mb-6">
                            <i class="fas fa-leaf mr-2"></i>
                            This is a carbon-neutral delivery
                        </p>
                        
                        <button id="close-order-modal-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                            Start New Order
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="dist/app.js"></script>
</body>
</html>
